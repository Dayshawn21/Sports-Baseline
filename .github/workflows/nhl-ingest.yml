name: NHL Ingest

# September through June, after the latest West Coast final.
on:
  schedule:
    - cron: "45 9 * 1-6,9-12 *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  ingest:
    name: NHL Ingest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Load NHL schedule and box scores
        run: |
          cd api
          python -m app.ingest.nhl_api

      - name: Relink stored NHL prop lines
        run: |
          cd api
          python -m app.ingest.prizepicks_nhl --relink

      # After the box scores and the relink, so freshly linked lines count and
      # last week's frozen predictions can settle (item 56d). Reads and prints,
      # writes nothing.
      - name: Report NHL forward ranking check
        run: |
          cd api
          python -m app.backtest.nhl_ranking_check | tee ranking_check_report.txt
          {
            echo '## NHL forward ranking check'
            echo '```'
            cat ranking_check_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
