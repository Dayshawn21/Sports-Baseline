name: NHL Ingest

# September through June, after the latest West Coast final.
on:
  schedule:
    - cron: "45 9 * 1-6,9-12 *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  ingest:
    name: NHL Ingest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Load NHL schedule and box scores
        run: |
          cd api
          python -m app.ingest.nhl_api
