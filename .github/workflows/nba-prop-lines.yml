name: NBA PrizePicks Prop Lines

# PrizePicks pulls lines at tip-off, so line history exists only from the
# snapshots taken before then (item 20c). Each run is free (public feed, no
# credits); the ingest honors 429 Retry-After and exits 75 when it gives up.
#
# Each run then freezes the reference projection and P(over) the game page
# serves for every modelled line not yet tipped off (item 20g3), the record
# the forward ranking check (20g4) grades.
#
# October through June only, matching the NBA data ingest. Both times sit off
# every nfl-prop-lines.yml run so the two never share a PrizePicks window.
on:
  # GitHub pauses schedules in a public repo after 60 days with no commit.
  schedule:
    # 16:30 UTC: the day's board once it is posted.
    - cron: "30 16 * 1-6,10-12 *"
    # 22:15 UTC: before the first 7 pm ET tip-off, after late line moves.
    - cron: "15 22 * 1-6,10-12 *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  prop-lines:
    name: PrizePicks NBA Lines
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Snapshot PrizePicks NBA lines
        run: |
          cd api
          status=0
          python -m app.ingest.prizepicks_nba || status=$?
          if [ "$status" -eq 75 ]; then
            echo "::error::PrizePicks rate limited the NBA line snapshot; no lines were stored this run."
          fi
          exit "$status"

      - name: Freeze pre-tip predictions
        run: |
          cd api
          python -m app.ingest.nba_prop_predictions
