name: NBA Preseason

# NBA preseason games and box scores from ESPN's site API, because hoopR's
# release files carry no preseason. Stored as game_type PRE with no week, for
# seeing early roles only; baselines, projections and grading never read it.
# Runs October 1 to 20 only: the preseason ends before opening night, and the
# daily nba-ingest.yml takes over from there.
on:
  # GitHub pauses schedules in a public repo after 60 days with no commit.
  schedule:
    - cron: "45 9 1-20 10 *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  preseason:
    name: NBA Preseason
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Load NBA preseason games and box scores
        run: |
          cd api
          python -m app.ingest.espn_nba_preseason
