name: NFL PrizePicks Prop Lines

# PrizePicks pulls lines at kickoff, so a line is gradeable only if a snapshot
# was taken before then. Each run is free (public feed, no credits); the ingest
# honors 429 Retry-After and exits 75 when it gives up.
#
# Each run then freezes the slate's projection, edge and P(over) for every line
# not yet kicked off (build-plan item 27i), the record 27j grades.
#
# September through February only, matching the NFL data ingest.
on:
  # GitHub pauses schedules in a public repo after 60 days with no commit.
  schedule:
    # Thursday 20:00 UTC: before the Thursday night game.
    - cron: "0 20 * 1,2,9-12 4"
    # Saturday 23:00 UTC: the Sunday board once it is mostly posted.
    - cron: "0 23 * 1,2,9-12 6"
    # Sunday 15:00 UTC: before the 17:00 UTC kickoffs.
    - cron: "0 15 * 1,2,9-12 0"
    # Monday 20:00 UTC: before the Monday night game.
    - cron: "0 20 * 1,2,9-12 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  prop-lines:
    name: PrizePicks NFL Lines
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Snapshot PrizePicks NFL lines
        run: |
          cd api
          status=0
          python -m app.ingest.prizepicks_nfl || status=$?
          if [ "$status" -eq 75 ]; then
            echo "::error::PrizePicks rate limited the NFL line snapshot; no lines were stored this run."
          fi
          exit "$status"

      - name: Freeze pre-kickoff predictions
        run: |
          cd api
          python -m app.ingest.nfl_prop_predictions

      # Last, and even after a failed step: the hosted demo serves stored slates
      # and never builds one inside its 512 MB (37d). Needs migration 0045.
      - name: Store the current NFL slates
        if: ${{ !cancelled() }}
        run: |
          cd api
          python -m app.ingest.nfl_slate_snapshot
