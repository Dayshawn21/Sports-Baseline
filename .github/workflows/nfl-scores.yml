name: NFL Scores

# Final scores and game status from the free NFLverse schedule asset, so a
# finished game reads final on the slate the next morning instead of waiting
# for Tuesday's nfl-ingest.yml. Daily rather than per game slot because it is
# free and takes seconds, and catches Thursday, Saturday, Sunday and Monday games
# alike. Schedule only: player stats still load Tuesday, so grading (27a, 27j)
# never settles a week early. Production serves stored slates, so the run ends
# by storing the slate weeks again; without that, a final would keep its old status.
#
# September through February only, matching the NFL data ingest.
on:
  # GitHub pauses schedules in a public repo after 60 days with no commit.
  schedule:
    - cron: "0 13 * 1,2,9-12 *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  scores:
    name: NFL Scores
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Load NFLverse schedule and scores
        run: |
          cd api
          python -m app.ingest.nflverse --schedule-only

      # Last, and even after a failed step: the hosted demo serves stored slates
      # and never builds one inside its 512 MB (37d), so a new final reaches the
      # slate only once its week is stored again. The default weeks (previous,
      # current, next) cover the week a Sunday or Monday night game closes.
      - name: Store the current NFL slates
        if: ${{ !cancelled() }}
        run: |
          cd api
          python -m app.ingest.nfl_slate_snapshot
