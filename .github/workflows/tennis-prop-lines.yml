name: Tennis PrizePicks Prop Lines

on:
  # GitHub pauses schedules after 60 days without a commit. Times are UTC.
  # PrizePicks pulls a line at match start and tennis plays around the clock,
  # so the second pull catches the evening and overnight boards. 19:45 sits off
  # the NBA, NHL and NFL PrizePicks pulls.
  schedule:
    - cron: "0 13 * * *"
    - cron: "45 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  prizepicks:
    name: PrizePicks Props Ingest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Ingest PrizePicks props
        run: |
          cd api
          status=0
          python -m app.ingest.prizepicks || status=$?
          if [ "$status" -eq 75 ]; then
            echo "::error::PrizePicks rate limited the tennis line pull; no lines were stored this run."
          fi
          exit "$status"

      # New lines get no projection until a snapshot runs, and a stored snapshot
      # is frozen. The 13:00 pull leaves its lines to the 13:30 predictions job,
      # which snapshots after the day's predictions exist.
      - name: Snapshot PrizePicks projections
        if: github.event.schedule == '45 19 * * *'
        run: |
          cd api
          python -m app.ingest.prop_snapshots
