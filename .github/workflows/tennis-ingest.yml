name: Tennis Match Ingest

on:
  # GitHub pauses schedules after 60 days without a commit. Times are UTC.
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}

jobs:
  livetennis:
    name: livetennisapi Match Ingest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Run livetennisapi ingest
        run: |
          cd api
          python -m app.ingest.livetennis --days-back 1 --days-ahead 1
