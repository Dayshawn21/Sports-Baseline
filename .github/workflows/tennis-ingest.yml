name: Tennis Data Ingest

on:
  # GitHub pauses schedules in a public repo after 60 days with no commit.
  schedule:
    # Daily match scrape — 12:30 AM Central (06:30 UTC)
    - cron: "30 6 * * *"
    # Odds refresh — every 4 hours at :10 past, covering the next 14h.
    #
    # The window has to outrun the 13:30 prediction job: a 4h window meant the
    # late half of a slate persisted with market_missing. 14h covers a 13:10 run
    # through to a 03:10 finish, so every match of the day is priced.
    #
    # Cadence is 4h during free-tier use because the odds-api.io free plan can
    # cut off busy Grand Slam slates. A run costs 1 events call plus one batch
    # per 10 matches, so the busiest observed day (123 matches) is 14 per run:
    # 84/day at this cadence against 168/day every 2h and 336 if hourly.
    #
    # Four hours also stays inside the 6h STALE_ODDS_HOURS threshold, so healthy
    # runs should not flag themselves stale.
    - cron: "10 */4 * * *"
    # PrizePicks props — 7:00 AM Central (13:00 UTC)
    - cron: "0 13 * * *"
    # Persist predictions after the daily props and odds cycle
    - cron: "30 13 * * *"
    # ELO refresh — 3:00 AM Central Monday (09:00 UTC Monday)
    - cron: "0 9 * * 1"
    # Player stats backfill — 4:00 AM Central (10:00 UTC)
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: "livetennis"
        type: choice
        options:
          - livetennis
          - odds
          - prizepicks
          - predictions
          - elo
          - player-stats

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Daily: fetch today + tomorrow's matches from livetennisapi.com
  # Plain HTTP API — no Playwright needed here.
  # ──────────────────────────────────────────────────────────────────────────
  livetennis:
    name: livetennisapi Match Ingest
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'livetennis'
      || (github.event_name == 'schedule' && github.event.schedule == '30 6 * * *')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Run livetennisapi ingest
        run: |
          cd api
          python -m app.ingest.livetennis --days-back 1 --days-ahead 1

  # ──────────────────────────────────────────────────────────────────────────
  # Every 4 hours: refresh odds for matches starting in the next 14 hours
  # ──────────────────────────────────────────────────────────────────────────
  odds:
    name: Odds Refresh
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'odds'
      || (github.event_name == 'schedule' && github.event.schedule == '10 */4 * * *')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Refresh odds
        run: |
          cd api
          python -m app.ingest.odds_api --hours-ahead 14

  # ──────────────────────────────────────────────────────────────────────────
  # Daily: fetch PrizePicks tennis props
  # ──────────────────────────────────────────────────────────────────────────
  prizepicks:
    name: PrizePicks Props Ingest
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'prizepicks'
      || (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Ingest PrizePicks props
        run: |
          cd api
          python -m app.ingest.prizepicks

  predictions:
    name: Daily Prediction Persistence
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'predictions'
      || (github.event_name == 'schedule' && github.event.schedule == '30 13 * * *')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Persist daily predictions
        run: |
          cd api
          python -m app.ingest.predictions

      # After predictions, so the props page's win probabilities are today's.
      - name: Snapshot PrizePicks projections
        run: |
          cd api
          python -m app.ingest.prop_snapshots

  # ──────────────────────────────────────────────────────────────────────────
  # Weekly: refresh ELO ratings from TennisAbstract
  # ──────────────────────────────────────────────────────────────────────────
  elo:
    name: ELO Refresh
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'elo'
      || (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Refresh ELO from TennisAbstract
        run: |
          cd api
          python -m app.ingest.elo --web

  # ──────────────────────────────────────────────────────────────────────────
  # Daily: backfill player serve/return stats from TennisAbstract
  # ──────────────────────────────────────────────────────────────────────────
  player-stats:
    name: Player Stats Backfill
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'player-stats'
      || (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Backfill player stats
        run: |
          cd api
          python -m app.ingest.player_stats --today-only --match-days-back 1 --match-days-ahead 1 --skip-computed-today
