name: NFL Sportsbook Prop Odds

# The Odds API key is on the free plan (500 credits a month). Each game costs one
# credit per market in PROP_MARKETS. With player_anytime_td alone, the Thursday
# game is priced twice (2 credits) and Sunday plus Monday twice (about 30): about
# 32 a week, about 160 a month in a five-week month. The ingest stops at
# --min-credits before any paid request.
#
# After the prop prices, each run also refreshes Pinnacle's game lines (3 credits,
# 12 a week across the four runs), so item 36's fair price is under a day old
# at bet time.
#
# GitHub starts scheduled runs late at busy times (2 to 3 hours in 2026 week 2,
# which missed every 1 PM ET game), so each game gets an early run that must
# land and a later refresh, all off the top of the hour.
#
# September through February only, matching the NFL data ingest.
on:
  schedule:
    # Wednesday 23:10 UTC (6:10 PM Central): the Thursday night game.
    - cron: "10 23 * 1,2,9-12 3"
    # Thursday 18:10 UTC (1:10 PM Central): Thursday night refresh.
    - cron: "10 18 * 1,2,9-12 4"
    # Saturday 23:10 UTC (6:10 PM Central): Sunday games plus Monday night.
    - cron: "10 23 * 1,2,9-12 6"
    # Sunday 12:10 UTC (7:10 AM Central): Sunday and Monday refresh. An
    # international game already started by then is skipped.
    - cron: "10 12 * 1,2,9-12 0"
  workflow_dispatch:
    inputs:
      hours_ahead:
        description: "Only games kicking off within this many hours"
        required: true
        default: "36"
      max_events:
        description: "Maximum games (credits) to fetch"
        required: true
        default: "1"

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

jobs:
  prop-odds:
    name: Anytime TD Prices
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      # The week's roster is often published after Tuesday's ingest, so refresh it
      # before game day. Free, and never allowed to block the paid price fetch.
      - name: Refresh current-season weekly rosters
        continue-on-error: true
        run: |
          cd api
          python -m app.ingest.nflverse_rosters

      # Final game statuses publish late in the week, so refresh them before game day too.
      - name: Refresh current-season injury reports
        continue-on-error: true
        run: |
          cd api
          python -m app.ingest.nflverse_injuries

      - name: Refresh current-season depth charts
        continue-on-error: true
        run: |
          cd api
          python -m app.ingest.nflverse_depth_charts

      - name: Fetch anytime TD prices
        env:
          # Each window reaches its target games' kickoff with slack for a late start:
          # Wednesday 30h and Thursday 8h for the Thursday game, Saturday 50h and
          # Sunday 40h for everything through Monday night.
          HOURS_AHEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.hours_ahead || (github.event.schedule == '10 23 * 1,2,9-12 3' && '30' || github.event.schedule == '10 18 * 1,2,9-12 4' && '8' || github.event.schedule == '10 23 * 1,2,9-12 6' && '50' || '40') }}
          MAX_EVENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_events || '16' }}
        run: |
          cd api
          python -m app.ingest.nfl_prop_odds --hours-ahead "$HOURS_AHEAD" --max-events "$MAX_EVENTS" --confirm-spend

      # After anytime TD, which has the prior claim on credits; never fails the run.
      - name: Refresh Pinnacle NFL odds
        continue-on-error: true
        run: |
          cd api
          python -m app.ingest.nfl_odds --days-ahead 14 --pinnacle

      # Last, and even after a failed step: the hosted demo serves stored slates
      # and never builds one inside its 512 MB (37d). Needs migration 0045.
      - name: Store the current NFL slates
        if: ${{ !cancelled() }}
        run: |
          cd api
          python -m app.ingest.nfl_slate_snapshot
