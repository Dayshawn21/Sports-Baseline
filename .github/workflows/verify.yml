name: Verify

# The one automated gate: runs the exact Verify command from AGENTS.md on every
# pull request and push to master. Changing its checks means changing
# AGENTS.md and this file together.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    env:
      # Settings requires a URL at import; no test connects, so no secret is needed.
      DATABASE_URL: postgresql://localhost/ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Verify
        run: npm --prefix web run verify && cd api && python -m pytest

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the range scan can read every commit the event brings in.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan tracked files
        run: |
          # git archive gives the tracked tree only, without .git.
          mkdir "$RUNNER_TEMP/tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/tree" \
            --config .gitleaks.toml --no-banner --redact --verbose

      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # A key added and deleted within the range still fails here.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE..$GITHUB_SHA"
          else
            range="-1 $GITHUB_SHA"
          fi
          echo "Scanning: $range"
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" \
            --config .gitleaks.toml --no-banner --redact --verbose
