name: NHL Injury and Goalie Snapshots

on:
  schedule:
    - cron: "17 * * 1-6,9-12 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nhl-context
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  context:
    name: ESPN NHL Injuries and Goalies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt
      - name: Snapshot ESPN NHL context
        working-directory: api
        run: python -m app.ingest.nhl_context
